name: release-c

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-c'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-c.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pure C release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -nE 's/^#define CHINADNS_VERSION "([^"]+)".*/\1/p' src/core.h)
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-c(\.[1-9][0-9]*)?$ ]]; then
            echo "::error::invalid Pure C version in src/core.h: '$version'" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match CHINADNS_VERSION '$version'" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chinadns-ng Pure C version: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build release matrix
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --target artifacts \
            --cache-from type=gha,scope=release-c \
            --cache-to type=gha,mode=max,scope=release-c \
            --output type=local,dest=dist \
            .

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          plain=$(find dist -maxdepth 1 -type f -name 'chinadns-ng@*' | wc -l)
          wolfssl=$(find dist -maxdepth 1 -type f -name 'chinadns-ng+wolfssl@*' | wc -l)
          noasm=$(find dist -maxdepth 1 -type f -name 'chinadns-ng+wolfssl_noasm@*' | wc -l)
          checksums=$(wc -l < dist/SHA256SUMS)

          [[ "$plain" -eq 23 ]] || { echo "::error::expected 23 plain binaries, got $plain"; exit 1; }
          [[ "$wolfssl" -eq 23 ]] || { echo "::error::expected 23 wolfSSL binaries, got $wolfssl"; exit 1; }
          [[ "$noasm" -eq 1 ]] || { echo "::error::expected 1 wolfSSL no-asm binary, got $noasm"; exit 1; }
          [[ "$checksums" -eq 47 ]] || { echo "::error::expected 47 checksums, got $checksums"; exit 1; }

          if find dist -maxdepth 1 -type f -name 'chinadns-ng*' ! -perm -u=x -print -quit | grep -q .; then
            echo "::error::one or more release binaries are not executable" >&2
            exit 1
          fi

          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chinadns-ng-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag=$GITHUB_REF_NAME
          assets=(dist/chinadns-ng* dist/SHA256SUMS)
          if [[ "${#assets[@]}" -ne 48 ]]; then
            echo "::error::expected 48 release assets, got ${#assets[@]}" >&2
            exit 1
          fi

          if release_is_draft=$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_is_draft" != true ]]; then
              echo "release $tag is already published; leaving it unchanged"
              exit 0
            fi

            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chinadns-ng $tag" \
              --draft=false \
              --prerelease=false \
              --latest
            exit 0
          fi

          previous_tag=
          while IFS= read -r candidate; do
            [[ "$candidate" == "$tag" ]] && continue
            [[ "$candidate" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-c(\.[1-9][0-9]*)?$ ]] || continue
            previous_tag=$candidate
            break
          done < <(git tag --sort=-creatordate)

          notes_args=(--generate-notes)
          if [[ -n "$previous_tag" ]]; then
            notes_args+=(--notes-start-tag "$previous_tag")
          elif git rev-parse --verify --quiet refs/tags/2025.08.09 >/dev/null; then
            notes_args+=(--notes-start-tag 2025.08.09)
          fi

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "chinadns-ng $tag" \
            --latest \
            "${notes_args[@]}"
